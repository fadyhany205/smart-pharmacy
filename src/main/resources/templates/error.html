<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status}">Error</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="text-center p-4">
    <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
    <h1 class="display-4 fw-bold" th:text="${status}">500</h1>
    <p class="lead" th:switch="${status}">
        <span th:case="403" th:text="#{error.403}"></span>
        <span th:case="404" th:text="#{error.404}"></span>
        <span th:case="*" th:text="#{error.500}"></span>
    </p>
    <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> <span th:text="#{nav.dashboard}"></span></a>
</div>
</body>
</html>
