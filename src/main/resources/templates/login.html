<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" th:dir="${rtl} ? 'rtl' : 'ltr'">
<head>
    <th:block th:replace="~{fragments :: printHead}"/>
    <title th:text="#{login.title}">Login</title>
    <style>
        body { background: linear-gradient(135deg, #1e293b, #0d6efd); min-height: 100vh; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="card shadow-lg" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <img th:if="${settings.logoPath}" th:src="${settings.logoPath}" alt="" style="max-height:80px;max-width:180px;object-fit:contain" class="mb-2">
            <i th:unless="${settings.logoPath}" class="bi bi-capsule-pill display-4 text-primary"></i>
            <h4 class="fw-bold mt-2" th:text="${settings.storeName}"></h4>
            <div class="text-muted" th:text="#{login.subtitle}"></div>
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2" th:text="#{login.error}"></div>
        <div th:if="${param.logout}" class="alert alert-success py-2" th:text="#{login.loggedOut}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" th:text="#{login.username}"></label>
                <input type="text" name="username" class="form-control form-control-lg" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{login.password}"></label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember-me" id="remember">
                <label class="form-check-label" for="remember" th:text="#{login.remember}"></label>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit" th:text="#{login.submit}"></button>
        </form>
        <div class="text-center mt-3">
            <a href="?lang=ar" class="me-2">عربي</a> | <a href="?lang=en" class="ms-2">English</a>
        </div>
        <footer th:replace="~{fragments :: vendorFooter}"></footer>
    </div>
</div>
</body>
</html>
