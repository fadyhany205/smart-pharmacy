<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#content}, ~{::script})}">
<head><title th:text="#{nav.reports}">Reports</title></head>
<body>
<div id="content">
    <h4 class="page-title mb-3" th:text="#{nav.reports}"></h4>
    <div class="row g-3">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="r : ${reports}">
            <a class="card h-100 text-decoration-none text-body" th:href="@{/reports/{id}(id=${r.id})}">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="stat-card"><div class="icon bg-primary-subtle text-primary"><i class="bi" th:classappend="${r.icon}"></i></div></div>
                    <div class="fw-semibold" th:text="#{${r.titleKey}}"></div>
                </div>
            </a>
        </div>
    </div>
</div>
<script></script>
</body>
</html>
