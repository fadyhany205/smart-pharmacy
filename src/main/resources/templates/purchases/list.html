<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#content}, ~{::script})}">
<head><title th:text="#{nav.purchases}">Purchases</title></head>
<body>
<div id="content">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h4 class="page-title" th:text="#{nav.purchases}"></h4>
        <a class="btn btn-primary ms-auto" th:href="@{/purchases/new}"><i class="bi bi-plus-lg"></i> <span th:text="#{nav.newPurchase}"></span></a>
    </div>
    <div class="card mb-3"><div class="card-body">
        <form class="row g-2 align-items-end" method="get">
            <div class="col-md-4">
                <label class="form-label small mb-0" th:text="#{common.search}"></label>
                <input type="text" name="q" class="form-control form-control-sm" th:value="${q}" th:placeholder="#{purchase.searchPlaceholder}">
            </div>
            <th:block th:replace="~{fragments :: dateFilter(${range})}"/>
            <div class="col-auto"><button class="btn btn-dark btn-sm"><i class="bi bi-funnel"></i> <span th:text="#{common.filter}"></span></button></div>
        </form>
    </div></div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr>
                    <th th:text="#{col.invoiceNo}"></th><th th:text="#{purchase.supplierInvoiceNo}"></th><th th:text="#{col.date}"></th>
                    <th th:text="#{col.supplier}"></th><th th:text="#{col.total}"></th><th th:text="#{col.paid}"></th>
                    <th th:text="#{col.remaining}"></th><th th:text="#{col.status}"></th>
                </tr></thead>
                <tbody>
                <tr th:each="p : ${page.content}">
                    <td><a class="fw-semibold" th:href="@{/purchases/{id}(id=${p.id})}" th:text="${p.invoiceNo}"></a></td>
                    <td th:text="${p.supplierInvoiceNo}"></td>
                    <td class="num" th:text="${@fmt.date(p.date)}"></td>
                    <td th:text="${p.supplier.name}"></td>
                    <td class="num fw-semibold" th:text="${@fmt.money(p.total)}"></td>
                    <td class="num" th:text="${@fmt.money(p.paid)}"></td>
                    <td class="num" th:classappend="${p.remaining.signum() > 0} ? 'text-danger'" th:text="${@fmt.money(p.remaining)}"></td>
                    <td><span th:replace="~{fragments :: status(${p.status})}"></span></td>
                </tr>
                <tr th:if="${page.empty}"><td colspan="8" class="text-center text-muted py-4" th:text="#{common.noData}"></td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments :: pager(${page})}"></div>
</div>
<script></script>
</body>
</html>
