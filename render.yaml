# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Render has no managed MySQL, so point DB_URL at an external MySQL (e.g. Aiven, TiDB Cloud, Railway).
services:
  - type: web
    name: smart-pharmacy
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      # e.g. jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED&useUnicode=true&characterEncoding=utf8&serverTimezone=Africa/Cairo
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # Where product images / store logo are saved. On the free plan this folder is wiped on every
      # deploy/restart. For permanent uploads use a paid plan, uncomment the disk below and set /var/data/uploads.
      - key: APP_UPLOADDIR
        value: /app/uploads
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1
